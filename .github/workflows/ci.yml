name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Pricing golden tests
        run: npx tsx lib/pricing/test.ts

      - name: No direct table mutations from the app
        run: npx tsx lib/tests/no-direct-mutations.test.ts

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: '2.31.0'

      - name: Start local Supabase (applies all migrations from scratch)
        run: supabase db reset --linked=false

      - name: Verify every migration was applied
        run: |
          expected=$(ls supabase/migrations/*.sql | wc -l)
          db=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          applied=$(docker exec "$db" psql -U postgres -tAc "select count(*) from supabase_migrations.schema_migrations" | tr -d ' ')
          echo "expected=$expected applied=$applied"
          test "$expected" -eq "$applied"

      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Generated types must match committed types
        run: |
          supabase gen types typescript --local --schema public > /tmp/supabase.types.ts
          diff -u lib/supabase.types.ts /tmp/supabase.types.ts

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::error title=pgTAP output::$(tail -n 40 /tmp/pgtap.log 2>/dev/null | tr '\n' ' ' | cut -c1-1500)"
          docker ps -a --format '{{.Names}} {{.Status}}'
          db=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          echo "::error title=DB log::$(docker logs --tail 40 "$db" 2>&1 | tr '\n' ' ' | cut -c1-1500)"

  integration-tests:
    runs-on: ubuntu-latest
    needs: [database-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: '2.31.0'

      - name: Start local Supabase
        run: supabase start

      - name: Serve Edge Functions with mock routing
        run: |
          printf 'ROUTING_PROVIDER=mock\n' > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/get_quote || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 2
          done

      - name: Run integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx vitest run --config supabase/tests/integration/vitest.config.ts 2>&1 | tee /tmp/integration.log

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::error title=Integration output::$(tail -n 40 /tmp/integration.log 2>/dev/null | tr '\n' ' ' | cut -c1-1500)"
          echo "::error title=Functions log::$(tail -n 40 /tmp/functions.log 2>/dev/null | tr '\n' ' ' | cut -c1-1500)"