name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Pricing golden tests
        run: npx tsx lib/pricing/test.ts

      - name: No direct table mutations from the app
        run: npx tsx lib/tests/no-direct-mutations.test.ts

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations from scratch)
        run: supabase start
        working-directory: ./supabase

      - name: Run pgTAP tests
        run: supabase test db
        working-directory: ./supabase

      - name: Generated types must match committed types
        run: |
          supabase gen types typescript --local > /tmp/supabase.types.ts
          diff -u ../lib/supabase.types.ts /tmp/supabase.types.ts
        working-directory: ./supabase

  integration-tests:
    runs-on: ubuntu-latest
    needs: [database-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start
        working-directory: ./supabase

      - name: Serve Edge Functions with mock routing
        run: |
          printf 'ROUTING_PROVIDER=mock\n' > functions/.env
          supabase functions serve --env-file functions/.env > /tmp/functions.log 2>&1 &
          sleep 15
        working-directory: ./supabase

      - name: Run integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          npx vitest run tests/integration/
        working-directory: ./supabase

      - name: Show function logs on failure
        if: failure()
        run: cat /tmp/functions.log